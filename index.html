le": "和之国的五年等待，在御田与大蛇眼中意味着什么？", "series": "同一事件下不同人物的立场", "duration": "2分40秒"}, {"id": 98, "person": "克比与黑胡子", "title": "蜂巢岛的交换筹码，在克比与黑胡子眼中有何不同？", "series": "同一事件下不同人物的立场", "duration": "2分40秒"}, {"id": 99, "person": "多弗朗明哥与罗", "title": "德雷斯罗萨的复仇，罗与多弗朗明哥为何都不肯退？", "series": "同一事件下不同人物的立场", "duration": "2分40秒"}, {"id": 100, "person": "龙与萨博", "title": "世界会议事件后，龙与萨博如何面对革命的代价？", "series": "同一事件下不同人物的立场", "duration": "2分40秒"}];const SERIES=["顶上战争中的人物选择与争议", "海军正义与世界政府的矛盾", "草帽团内部的友情、责任与冲突", "四皇的行为逻辑与失败原因", "海贼之间的信念、利益与背叛", "容易被忽略的人物行为与剧情细节", "海贼王世界观中的规则与矛盾", "人物命运、心理变化与遗憾", "改变剧情走向的关键决定", "同一事件下不同人物的立场"];const STORE='op100-selection-v1';let chosen=JSON.parse(localStorage.getItem(STORE)||'[]').filter(id=>ITEMS.some(x=>x.id===id));let only=false;const $=id=>document.getElementById(id);function save(){localStorage.setItem(STORE,JSON.stringify(chosen))}function render(){let f=$('filter').value;let arr=ITEMS.filter(x=>(f==='all'||x.series===f)&&(!only||chosen.includes(x.id)));$('count').textContent=`已选 ${chosen.length}/100期`;$('only').classList.toggle('active',only);$('list').innerHTML=arr.length?arr.map(x=>`<div class="card ${chosen.includes(x.id)?'sel':''}" role="checkbox" aria-checked="${chosen.includes(x.id)}" tabindex="0" data-id="${x.id}"><div class="circle">${chosen.includes(x.id)?'✓':''}</div><div><div class="name">第${String(x.id).padStart(3,'0')}期 · ${esc(x.person)}</div><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.series)} · 2分40秒</div></div></div>`).join(''):'<div class="empty">当前筛选下没有题材</div>'}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toggle(id){chosen=chosen.includes(id)?chosen.filter(x=>x!==id):[...chosen,id];save();render()}$('list').addEventListener('click',e=>{let el=e.target.closest('[data-id]');if(el)toggle(+el.dataset.id)});$('list').addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){let el=e.target.closest('[data-id]');if(el){e.preventDefault();toggle(+el.dataset.id)}}});$('filter').innerHTML='<option value="all">全部系列（100期）</option>'+SERIES.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');$('filter').onchange=render;$('all').onclick=()=>{chosen=ITEMS.map(x=>x.id);save();render()};$('none').onclick=()=>{chosen=[];save();render()};$('only').onclick=()=>{only=!only;render()};function instruction(){let arr=chosen.map(id=>ITEMS.find(x=>x.id===id));return `请按照以下勾选顺序创作《海贼王》争议性深度解读系列，本次只写第一期，其余题材保留在待创作队列中。\n\n已选题材（按勾选顺序）：\n${arr.map((x,i)=>`${i+1}. 第${String(x.id).padStart(3,'0')}期《${x.title}》（${x.person}｜${x.series}｜2分40秒）`).join('\n')}\n\n创作要求：每期2分40秒，约1013字符（含标点，交稿前实际核对）；前三秒直接切入具体剧情细节或人物行为，迅速引出核心争议；通过原作剧情、人物动机、不同立场、事件后果深入分析，提出有依据的独立判断；口语化短句、真人口播；禁止AI模板词、机械过渡、作文式抒情、空洞总结、重复解释、无意义铺垫、战力数值计算；遵守漫画、动画与可核实官方设定，不编造剧情或混淆时间线；正文全文不换行；附20字以内抖音标题；结尾留下有讨论价值的问题，并衔接下一期已勾选题材。\n\n每期交稿前检查：前三秒吸引力、冗长划走点、原作证据、重复解释、AI味、讨论价值、实际字符数。\n\n勾选多期时只输出第一期。之后我回复“下一期”，继续创作队列中的下一条。`}$('go').onclick=()=>{if(!chosen.length){alert('请先勾选至少一期');return}$('prompt').value=instruction();$('modal').classList.add('show')};$('close').onclick=()=>$('modal').classList.remove('show');$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('prompt').value);$('copy').textContent='已复制 ✓'}catch(e){$('prompt').select();document.execCommand('copy');$('copy').textContent='已尝试复制'}};$('chat').onclick=()=>{window.open('https://chatgpt.com/','_blank')};render();</script></body></html>
